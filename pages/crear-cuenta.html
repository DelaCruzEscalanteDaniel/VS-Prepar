<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../styles/sesion.css">
</head>
<body>
    <div class="inicio" id="inicio">
        <h1>¡Bienvenido a Prepar!</h1>
        <h2>Regístrate: </h2>

        <form action="">
            <label for="">Usuario: </label>
            <input class="usuario" id="usuario" type="text" placeholder="Nombre de usuario" required>
        <br>
            <label for="">Correo: </label>
            <input class="correo" id="correo" type="email" placeholder="usuario@dominio.com" required>
        <br>
            <label for="">Contraseña: </label>
            <input class="contraseña" id="contraseña" type="password" required>
        <br>
            <input id="crear-cuenta" class="boton" type="submit" value="Crear Cuenta">
        </form>

    </div>
</body>
</html>
