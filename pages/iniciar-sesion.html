<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión</title>
    <link rel="stylesheet" href="../styles/sesion.css">
</head>
<body>
    <div class="inicio" id="inicio">
        <h1>¡Bienvenido a Prepar!</h1>
        <h2>Inicia Sesión: </h2>

        <form action="">
            <label for="">Correo: </label>
            <input class="correo" id="correo" type="email" placeholder="usuario@dominio.com" required>
        <br>
            <label for="">Contraseña: </label>
            <input class="contraseña" id="contraseña" type="password" required>
        <br>
            <input id="iniciar-sesion" class="boton" type="submit" value="Iniciar Sesión">
            <p>¿Aún no tienes cuenta? <a href="crear-cuenta.html">Regístrate aquí</a></p>
        </form>

    </div>
</body>
</html>
